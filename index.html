<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Kingdom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
  </style>
</head>
<body class="min-h-[100dvh] bg-slate-950 text-slate-200 font-sans flex flex-col select-none overflow-x-hidden">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-amber-400 text-amber-950 font-black px-6 py-3 rounded-xl shadow-2xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none border-2 border-amber-500 hidden">
  </div>

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 shrink-0">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        <h1 class="text-xl md:text-2xl font-bold text-white uppercase tracking-wider">Mini Kingdom</h1>
        <span id="cloud-status" class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700">
          Local Only
        </span>
      </div>
      
      <div class="flex gap-2 md:gap-4 overflow-x-auto pb-1 md:pb-0">
        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <span>🌲</span> <span id="ui-wood" class="font-bold w-10 text-right">100</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <span>🪨</span> <span id="ui-stone" class="font-bold w-10 text-right">50</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <span>🍒</span> <span id="ui-food" class="font-bold w-10 text-right">200</span>
        </div>
        <div class="flex items-center gap-2 bg-amber-950/50 px-3 py-1.5 rounded-lg border border-amber-900/50">
          <span>💰</span> <span id="ui-gold" class="font-bold text-amber-500 w-10 text-right">50</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-4">
    
    <!-- LEFT PANEL: Controls -->
    <div class="bg-slate-900 rounded-xl border border-slate-800 p-4 flex flex-col gap-4">
      <h2 class="font-bold text-lg text-amber-500 flex items-center gap-2 border-b border-slate-800 pb-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Town Controls
      </h2>
      
      <div class="space-y-3 flex-1">
        <p class="text-xs text-slate-400">Enable AUTO to command your workers to harvest.</p>
        
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
          <span class="font-bold text-sm flex items-center gap-2">🌲 Wood</span>
          <button id="btn-auto-wood" class="px-3 py-1 rounded text-xs font-bold transition-colors bg-slate-800 text-slate-400">AUTO OFF</button>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
          <span class="font-bold text-sm flex items-center gap-2">🪨 Stone</span>
          <button id="btn-auto-stone" class="px-3 py-1 rounded text-xs font-bold transition-colors bg-slate-800 text-slate-400">AUTO OFF</button>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
          <span class="font-bold text-sm flex items-center gap-2">🍒 Food</span>
          <button id="btn-auto-food" class="px-3 py-1 rounded text-xs font-bold transition-colors bg-slate-800 text-slate-400">AUTO OFF</button>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center">
          <span class="font-bold text-sm flex items-center gap-2">🪙 Gold</span>
          <button id="btn-auto-gold" class="px-3 py-1 rounded text-xs font-bold transition-colors bg-slate-800 text-slate-400">AUTO OFF</button>
        </div>
      </div>

      <div class="flex flex-col gap-2 mt-4">
        <button id="btn-hire-worker" class="w-full bg-amber-600 hover:bg-amber-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold p-3 rounded-lg transition-colors flex flex-col items-center">
          <span>Hire Worker 🧑‍🌾 <span id="ui-worker-boost" class="hidden">⚡</span> (<span id="ui-workers">3</span>)</span>
          <span class="text-xs font-normal mt-1 opacity-80">Cost: 50 🍒, 20 💰</span>
        </button>

        <button id="btn-hire-soldier" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold p-3 rounded-lg transition-colors flex flex-col items-center">
          <span>Train Soldier 🛡️ (<span id="ui-soldiers">0</span>)</span>
          <span class="text-xs font-normal mt-1 opacity-80">Cost: 30 🍒, 30 💰</span>
        </button>
      </div>
    </div>

    <!-- CENTER PANEL: THE MAP -->
    <div id="map-container" class="lg:col-span-2 bg-[#166534] rounded-xl border-4 border-slate-800 overflow-hidden relative shadow-inner min-h-[400px]">
      
      <!-- Invasion Warning Timer -->
      <div id="invasion-banner" class="absolute top-2 left-2 z-40 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 flex items-center gap-2">
        <svg id="invasion-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M8 20v2h8v-2"/><path d="m12.5 17-.5-1-.5 1h1z"/><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"/></svg>
        <span id="invasion-timer" class="text-slate-300">Invasion in 45s</span>
      </div>

      <!-- Town Center -->
      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 flex items-center justify-center">
        <div class="w-24 h-24 bg-[#854d0e] rounded-full absolute opacity-50"></div>
        <span class="text-6xl relative z-10 filter drop-shadow-xl">🏰</span>
      </div>
      
      <!-- Dynamic entities will be injected here via JS -->
    </div>

    <!-- RIGHT PANEL: Multiplayer -->
    <div class="bg-indigo-950/40 rounded-xl border border-indigo-900/50 p-4 flex flex-col">
      <h2 class="font-bold text-lg text-indigo-400 flex items-center gap-2 border-b border-indigo-900/50 pb-2 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        World Lobby
      </h2>
      
      <form id="lobby-form" class="mb-4">
        <div class="flex gap-2">
          <input 
            type="text" id="world-input"
            placeholder="Lobby name or Secret Code..."
            class="flex-1 bg-slate-900 border border-indigo-800 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-indigo-500"
          />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded text-sm shrink-0">
            Join
          </button>
        </div>
      </form>

      <div id="lobby-content" class="flex-1 flex flex-col min-h-0">
         <div class="flex-1 flex flex-col items-center justify-center text-center text-indigo-300/50">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2 opacity-50"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
            <p class="text-xs">Enter a world name to share stats with friends.</p>
         </div>
      </div>
    </div>

  </main>

  <!-- GAME LOGIC SCRIPT -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // --- FIREBASE CONFIGURATION ---
    let db = null;
    let auth = null;
    let appId = 'default-kingdom-app';
    let user = null;
    let unsubLobby = null;

    try {
      const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
      if (configStr) {
        const firebaseConfig = JSON.parse(configStr);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        appId = typeof __app_id !== 'undefined' ? __app_id : appId;
      }
    } catch (e) {
      console.log("Firebase not configured, running locally.");
    }

    // --- GAME ENGINE STATE ---
    const game = {
      resources: { wood: 100, stone: 50, food: 200, gold: 50 },
      autoTasks: { wood: false, stone: false, food: false, gold: false },
      nodes: [],
      workers: [],
      soldiers: [],
      heroes: [],
      enemies: [],
      usedCodes: [],
      workerBoost: false,
      invasionCount: 0,
      nextInvasion: Date.now() + 45000,
      lastTick: Date.now(),
      activeWorld: "",
      neighbors: []
    };

    const mapContainer = document.getElementById('map-container');

    // --- DOM ELEMENT CREATION HELPERS ---
    function createDOMElement(id, content, extraClasses = '') {
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement('div');
        el.id = id;
        // Using setAttribute instead of className to prevent readonly errors in strict mode
        el.setAttribute('class', `absolute transform -translate-x-1/2 -translate-y-1/2 ${extraClasses}`);
        mapContainer.appendChild(el);
      }
      el.innerHTML = content;
      return el;
    }

    function removeDOMElement(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // --- MAP INITIALIZATION ---
    function initMap() {
      const randomCoord = (minR, maxR) => {
        const angle = Math.random() * Math.PI * 2;
        const r = minR + Math.random() * (maxR - minR);
        return { x: 500 + Math.cos(angle) * r, y: 500 + Math.sin(angle) * r };
      };

      const addNodes = (count, type, emoji, minR, maxR) => {
        for(let i=0; i<count; i++) {
          const pos = randomCoord(minR, maxR);
          const id = `node_${type}_${i}`;
          game.nodes.push({ id, type, emoji, x: pos.x, y: pos.y });
          const el = createDOMElement(id, emoji, 'z-10 text-2xl filter drop-shadow-md');
          el.style.setProperty('left', `${(pos.x/1000)*100}%`);
          el.style.setProperty('top', `${(pos.y/1000)*100}%`);
        }
      };

      addNodes(15, 'wood', '🌲', 150, 450);
      addNodes(10, 'stone', '🪨', 120, 400);
      addNodes(12, 'food', '🍒', 100, 300);
      addNodes(8, 'gold', '🪙', 150, 450);

      for(let i=0; i<3; i++) {
        addWorker();
      }
    }

    function addWorker() {
      const id = `w_${Math.random()}`;
      game.workers.push({
        id, x: 500 + (Math.random()*40-20), y: 500 + (Math.random()*40-20),
        state: 'idle', target: null, inventory: null, timer: 0
      });
      createDOMElement(id, `🧑‍🌾<span id="${id}_inv" class="absolute -top-3 -right-2 text-sm hidden filter drop-shadow-md"></span>`, 'z-30 text-xl');
    }

    function addSoldier() {
      const id = `s_${Math.random()}`;
      game.soldiers.push({ id, x: 500 + (Math.random()*40-20), y: 500 + (Math.random()*40-20) });
      createDOMElement(id, '🛡️', 'z-30 text-xl drop-shadow-lg');
    }

    function addHero(type, emoji) {
      const id = `h_${Math.random()}`;
      game.heroes.push({ id, type, emoji, x: 500, y: 500 });
      createDOMElement(id, emoji, 'z-40 text-3xl drop-shadow-2xl');
    }

    // --- MAIN GAME LOOP ---
    function gameLoop() {
      const now = Date.now();
      const dt = Math.min((now - game.lastTick) / 1000, 0.1);
      game.lastTick = now;
      const speed = 120;

      // 1. INVASION SPAWN LOGIC
      if (now > game.nextInvasion) {
        game.nextInvasion = now + 45000;
        game.invasionCount++;
        
        const isBossWave = game.invasionCount % 5 === 0;

        if (isBossWave) {
          const angle = Math.random() * Math.PI * 2;
          const id = `e_${Math.random()}`;
          const e = { id, x: 500 + Math.cos(angle)*600, y: 500 + Math.sin(angle)*600, isBoss: true, hp: 15, maxHp: 15, size: 2, emoji: '👹' };
          game.enemies.push(e);
          createDOMElement(id, getBossHTML(e), 'z-30 text-5xl drop-shadow-lg');
        } else {
          const baseCount = 1 + Math.floor(Math.random() * 3);
          const scaleCount = Math.floor(game.invasionCount / 2);
          const count = baseCount + scaleCount;
          
          for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const id = `e_${Math.random()}`;
            const e = { id, x: 500 + Math.cos(angle)*600, y: 500 + Math.sin(angle)*600, isBoss: false, hp: 1, size: 1, emoji: '👺' };
            game.enemies.push(e);
            createDOMElement(id, '👺', 'z-30 text-2xl drop-shadow-lg');
          }
        }
      }

      function getBossHTML(e) {
        return `👹<div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-10 h-1.5 bg-red-950 rounded-full overflow-hidden border border-slate-800"><div id="${e.id}_hp" class="h-full bg-red-500" style="width: ${(e.hp/e.maxHp)*100}%"></div></div>`;
      }

      // 2. ENEMY COMBAT & MOVEMENT
      let survivingEnemies = [];
      let survivingSoldiers = [...game.soldiers];
      let survivingWorkers = [...game.workers];

      game.enemies.forEach(e => {
        let killed = false;

        for (let i = 0; i < game.heroes.length; i++) {
          const h = game.heroes[i];
          if (Math.hypot(e.x - h.x, e.y - h.y) < (35 * e.size)) {
            e.hp -= 5 * dt;
          }
        }

        for (let i = 0; i < survivingSoldiers.length; i++) {
          const s = survivingSoldiers[i];
          if (Math.hypot(e.x - s.x, e.y - s.y) < (20 * e.size)) {
            e.hp -= 1;
            removeDOMElement(s.id);
            survivingSoldiers.splice(i, 1); 
            if (e.hp <= 0) break;
          }
        }

        if (e.hp <= 0) {
          killed = true;
          removeDOMElement(e.id);
        }

        if (!killed) {
          for (let i = 0; i < survivingWorkers.length; i++) {
             const w = survivingWorkers[i];
             if (Math.hypot(e.x - w.x, e.y - w.y) < (15 * e.size)) {
                removeDOMElement(w.id);
                survivingWorkers.splice(i, 1);
             }
          }

          if (Math.hypot(500 - e.x, 500 - e.y) < (20 * e.size)) {
            const stealAmount = e.isBoss ? 50 : 10;
            game.resources.gold = Math.max(0, game.resources.gold - stealAmount);
            game.resources.food = Math.max(0, game.resources.food - stealAmount);
          } else {
            let targetX = 500, targetY = 500, minWDist = 120 * (e.isBoss ? 1.5 : 1), targetWorker = null;
            for (let w of survivingWorkers) {
               const wDist = Math.hypot(e.x - w.x, e.y - w.y);
               if (wDist < minWDist) { minWDist = wDist; targetWorker = w; }
            }
            if (targetWorker) { targetX = targetWorker.x; targetY = targetWorker.y; }

            const dx = targetX - e.x, dy = targetY - e.y, dist = Math.hypot(dx, dy);
            e.x += (dx / dist) * (e.isBoss ? 20 : 40) * dt;
            e.y += (dy / dist) * (e.isBoss ? 20 : 40) * dt;
            
            survivingEnemies.push(e);
            const el = document.getElementById(e.id);
            if (el) { 
              el.style.setProperty('left', `${(e.x/1000)*100}%`); 
              el.style.setProperty('top', `${(e.y/1000)*100}%`); 
              if (e.isBoss) {
                const hpBar = document.getElementById(`${e.id}_hp`);
                if(hpBar) hpBar.style.setProperty('width', `${(e.hp/e.maxHp)*100}%`);
              }
            }
          }
        }
      });
      game.enemies = survivingEnemies;
      game.soldiers = survivingSoldiers;
      game.workers = survivingWorkers;

      // 3. SOLDIER AI
      game.soldiers.forEach(s => {
        let target = null, minDist = Infinity;
        game.enemies.forEach(e => {
          const dist = Math.hypot(e.x - s.x, e.y - s.y);
          if (dist < minDist) { minDist = dist; target = e; }
        });

        if (target) {
          const dx = target.x - s.x, dy = target.y - s.y, dist = Math.hypot(dx, dy);
          s.x += (dx / dist) * speed * dt; s.y += (dy / dist) * speed * dt;
        } else {
          const dx = 500 - s.x, dy = 500 - s.y, dist = Math.hypot(dx, dy);
          if (dist > 80) { s.x += (dx / dist) * (speed * 0.4) * dt; s.y += (dy / dist) * (speed * 0.4) * dt; }
        }
        const el = document.getElementById(s.id);
        if (el) { 
          el.style.setProperty('left', `${(s.x/1000)*100}%`); 
          el.style.setProperty('top', `${(s.y/1000)*100}%`); 
        }
      });

      // 4. HERO AI
      game.heroes.forEach(h => {
        let target = null, minDist = Infinity;
        game.enemies.forEach(e => {
          const dist = Math.hypot(e.x - h.x, e.y - h.y);
          if (dist < minDist) { minDist = dist; target = e; }
        });
        const heroSpeed = speed * 1.8;
        if (target) {
          const dx = target.x - h.x, dy = target.y - h.y, dist = Math.hypot(dx, dy);
          h.x += (dx / dist) * heroSpeed * dt; h.y += (dy / dist) * heroSpeed * dt;
        } else {
          const dx = 500 - h.x, dy = 500 - h.y, dist = Math.hypot(dx, dy);
          if (dist > 150) { h.x += (dx / dist) * (heroSpeed * 0.4) * dt; h.y += (dy / dist) * (heroSpeed * 0.4) * dt; } 
          else { h.x += (Math.random() - 0.5) * heroSpeed * 0.5 * dt; h.y += (Math.random() - 0.5) * heroSpeed * 0.5 * dt; }
        }
        const el = document.getElementById(h.id);
        if (el) { 
          el.style.setProperty('left', `${(h.x/1000)*100}%`); 
          el.style.setProperty('top', `${(h.y/1000)*100}%`); 
        }
      });

      // 5. WORKER AI
      const activeWorkerSpeed = speed * (game.workerBoost ? 2 : 1);
      const harvestAmount = 5 * (game.workerBoost ? 2 : 1);
      const hasEnemies = game.enemies.length > 0;

      game.workers.forEach(w => {
        if (hasEnemies) {
          w.state = 'hiding';
          let targetX = 500, targetY = 500, minDist = Infinity;
          const protectors = [...game.heroes, ...game.soldiers];
          protectors.forEach(p => {
            const dist = Math.hypot(p.x - w.x, p.y - w.y);
            if (dist < minDist) { minDist = dist; targetX = p.x; targetY = p.y; }
          });
          const dx = targetX - w.x, dy = targetY - w.y, dist = Math.hypot(dx, dy);
          if (dist > 30) { w.x += (dx / dist) * activeWorkerSpeed * dt; w.y += (dy / dist) * activeWorkerSpeed * dt; }
        } else {
          if (w.state === 'hiding') w.state = w.inventory ? 'returning' : 'idle';

          if (w.state === 'idle') {
            const activeKeys = Object.keys(game.autoTasks).filter(k => game.autoTasks[k]);
            if (activeKeys.length > 0) {
              const taskType = activeKeys[Math.floor(Math.random() * activeKeys.length)];
              const validNodes = game.nodes.filter(n => n.type === taskType);
              if (validNodes.length > 0) {
                let nearest = validNodes[0], minDist = Infinity;
                validNodes.forEach(n => {
                  const d = Math.hypot(n.x - w.x, n.y - w.y);
                  if (d < minDist) { minDist = d; nearest = n; }
                });
                w.target = nearest; w.state = 'seeking';
              }
            } else {
               const dx = 500 - w.x, dy = 500 - w.y;
               if (Math.hypot(dx, dy) > 100) { w.x += (dx / Math.hypot(dx, dy)) * (activeWorkerSpeed * 0.3) * dt; w.y += (dy / Math.hypot(dx, dy)) * (activeWorkerSpeed * 0.3) * dt; }
            }
          }

          if (w.state === 'seeking' && w.target) {
            const dx = w.target.x - w.x, dy = w.target.y - w.y, dist = Math.hypot(dx, dy);
            if (dist < 5) { w.state = 'gathering'; w.timer = game.workerBoost ? 0.5 : 1.0; } 
            else { w.x += (dx / dist) * activeWorkerSpeed * dt; w.y += (dy / dist) * activeWorkerSpeed * dt; }
          }

          if (w.state === 'gathering' && w.target) {
            w.timer -= dt;
            if (w.timer <= 0) { w.inventory = w.target.type; w.state = 'returning'; w.target = null; }
          }

          if (w.state === 'returning') {
            const dx = 500 - w.x, dy = 500 - w.y, dist = Math.hypot(dx, dy);
            if (dist < 20) {
              if (w.inventory) { game.resources[w.inventory] += harvestAmount; w.inventory = null; }
              w.state = 'idle';
            } else { w.x += (dx / dist) * activeWorkerSpeed * dt; w.y += (dy / dist) * activeWorkerSpeed * dt; }
          }
        }

        const el = document.getElementById(w.id);
        if (el) {
          el.style.setProperty('left', `${(w.x / 1000) * 100}%`); 
          el.style.setProperty('top', `${(w.y / 1000) * 100}%`);
        }
        const invEl = document.getElementById(`${w.id}_inv`);
        if (invEl) {
          if (w.inventory) {
            invEl.textContent = w.inventory === 'wood' ? '🌲' : w.inventory === 'stone' ? '🪨' : w.inventory === 'gold' ? '🪙' : '🍒';
            invEl.style.setProperty('display', 'block');
          } else { 
            invEl.style.setProperty('display', 'none'); 
          }
        }
      });

      requestAnimationFrame(gameLoop);
    }

    // --- UI UPDATES (Called periodically to decouple from 60fps loop) ---
    function updateUI() {
      // Safe text updates using textContent to prevent readonly property errors
      const safeSetText = (id, text) => {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      };

      safeSetText('ui-wood', Math.floor(game.resources.wood));
      safeSetText('ui-stone', Math.floor(game.resources.stone));
      safeSetText('ui-food', Math.floor(game.resources.food));
      safeSetText('ui-gold', Math.floor(game.resources.gold));
      safeSetText('ui-workers', game.workers.length);
      safeSetText('ui-soldiers', game.soldiers.length);

      const boostEl = document.getElementById('ui-worker-boost');
      if (boostEl) {
        boostEl.style.setProperty('display', game.workerBoost ? 'inline' : 'none');
      }

      const timer = Math.max(0, Math.floor((game.nextInvasion - Date.now()) / 1000));
      const invTimerEl = document.getElementById('invasion-timer');
      const invIconEl = document.getElementById('invasion-icon');
      
      if (invTimerEl && invIconEl) {
        if (timer > 0) {
          invTimerEl.textContent = `Invasion in ${timer}s`;
          // Using setAttribute instead of .className = ...
          invTimerEl.setAttribute('class', 'text-slate-300');
          invIconEl.setAttribute('class', `text-slate-400 ${timer < 10 ? 'text-rose-500 animate-pulse' : ''}`);
        } else {
          invTimerEl.textContent = '🚨 INVADERS! 🚨';
          invTimerEl.setAttribute('class', 'text-rose-400');
          invIconEl.setAttribute('class', 'text-rose-500 animate-pulse');
        }
      }

      // Safe disabled attribute handling
      const btnWorker = document.getElementById('btn-hire-worker');
      if (btnWorker) {
        if (game.resources.food < 50 || game.resources.gold < 20) {
          btnWorker.setAttribute('disabled', 'true');
        } else {
          btnWorker.removeAttribute('disabled');
        }
      }

      const btnSoldier = document.getElementById('btn-hire-soldier');
      if (btnSoldier) {
        if (game.resources.food < 30 || game.resources.gold < 30) {
          btnSoldier.setAttribute('disabled', 'true');
        } else {
          btnSoldier.removeAttribute('disabled');
        }
      }
    }

    // --- EVENT LISTENERS & ACTIONS ---
    function setupControls() {
      const tasks = ['wood', 'stone', 'food', 'gold'];
      const colors = { wood: 'bg-emerald-600', stone: 'bg-slate-500', food: 'bg-rose-600', gold: 'bg-amber-600' };
      
      tasks.forEach(task => {
        document.getElementById(`btn-auto-${task}`).addEventListener('click', (e) => {
          game.autoTasks[task] = !game.autoTasks[task];
          e.target.textContent = game.autoTasks[task] ? 'AUTO ON' : 'AUTO OFF';
          if (game.autoTasks[task]) {
            e.target.classList.replace('bg-slate-800', colors[task]);
            e.target.classList.replace('text-slate-400', 'text-white');
          } else {
            e.target.classList.replace(colors[task], 'bg-slate-800');
            e.target.classList.replace('text-white', 'text-slate-400');
          }
        });
      });

      document.getElementById('btn-hire-worker').addEventListener('click', () => {
        if (game.resources.food >= 50 && game.resources.gold >= 20) {
          game.resources.food -= 50; game.resources.gold -= 20;
          addWorker(); updateUI();
        }
      });

      document.getElementById('btn-hire-soldier').addEventListener('click', () => {
        if (game.resources.food >= 30 && game.resources.gold >= 30) {
          game.resources.food -= 30; game.resources.gold -= 30;
          addSoldier(); updateUI();
        }
      });

      document.getElementById('lobby-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('world-input').value.trim().toUpperCase();
        const codes = ['FREECOINS', 'ALLIANCE', 'LUMINITE', 'DARKNESS', 'KOALASEATME', 'BOOST'];

        if (codes.includes(input)) {
          if (game.usedCodes.includes(input)) {
             showToast("⚠️ Code already used!"); document.getElementById('world-input').value = ""; return;
          }
          game.usedCodes.push(input);
          switch(input) {
            case 'FREECOINS': game.resources.gold += 100; showToast("🎉 Rewarded 100 Coins! 💰"); break;
            case 'ALLIANCE': for(let i=0; i<30; i++) addSoldier(); showToast("🎉 30 Soldiers joined! 🛡️"); break;
            case 'LUMINITE': addHero('Lumi', '🌟'); showToast("🎉 Hero Lumi joined! 🌟"); break;
            case 'DARKNESS': addHero('Shade', '🌑'); showToast("🎉 Hero Shade joined! 🌑"); break;
            case 'KOALASEATME': addHero('BACONSUNITED', '🐨'); showToast("🎉 Hero BACONSUNITED joined! 🐨"); break;
            case 'BOOST': game.workerBoost = true; showToast("🎉 2x Worker Boost Applied! ⚡"); break;
          }
          document.getElementById('world-input').value = "";
          updateUI();
        } else if (input) {
          game.activeWorld = input.toLowerCase();
          setupMultiplayer();
        }
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      // Trigger reflow to restart animation
      void t.offsetWidth;
      t.classList.replace('opacity-0', 'opacity-100');
      t.classList.add('-translate-y-4');
      setTimeout(() => {
        t.classList.replace('opacity-100', 'opacity-0');
        t.classList.remove('-translate-y-4');
        setTimeout(() => t.classList.add('hidden'), 300);
      }, 3000);
    }

    // --- FIREBASE SYNC & MULTIPLAYER ---
    async function initFirebase() {
      if (!auth) return;
      
      const setStatus = (msg) => {
        const el = document.getElementById('cloud-status');
        if (el) el.textContent = msg;
      };
      setStatus("Connecting...");

      onAuthStateChanged(auth, async (u) => {
        if (u) {
          user = u;
          setStatus("☁️ Saved to Cloud");
          
          try {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'kingdom', 'save'));
            if (snap.exists()) {
              const data = snap.data();
              if (data.resources) Object.assign(game.resources, data.resources);
              game.usedCodes = data.usedCodes || [];
              game.workerBoost = data.workerBoost || false;
              game.invasionCount = data.invasionCount || 0;
              
              // Load saved UI states
              if (data.autoTasks) {
                game.autoTasks = data.autoTasks;
                ['wood','stone','food','gold'].forEach(t => {
                   if(game.autoTasks[t]) document.getElementById(`btn-auto-${t}`).click(); // trigger the UI update safely
                });
              }

              // Re-create dynamic entities based on save data counts
              const wCount = data.workers || 3;
              game.workers.forEach(w => removeDOMElement(w.id)); game.workers = [];
              for(let i=0; i<wCount; i++) addWorker();

              const sCount = data.soldiers || 0;
              game.soldiers.forEach(s => removeDOMElement(s.id)); game.soldiers = [];
              for(let i=0; i<sCount; i++) addSoldier();

              if (data.heroes) {
                game.heroes.forEach(h => removeDOMElement(h.id)); game.heroes = [];
                data.heroes.forEach(h => addHero(h.type, h.emoji));
              }
            }
          } catch (e) { console.error(e); }

          // Background Saver
          setInterval(() => {
            if (!user || !db) return;
            setStatus("☁️ Saving...");
            setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'kingdom', 'save'), {
              resources: game.resources,
              autoTasks: game.autoTasks,
              workers: game.workers.length,
              soldiers: game.soldiers.length,
              heroes: game.heroes,
              usedCodes: game.usedCodes,
              workerBoost: game.workerBoost,
              invasionCount: game.invasionCount,
              lastSaved: Date.now()
            }, { merge: true }).then(() => setStatus("☁️ Saved to Cloud")).catch(()=>{});
          }, 15000);
        }
      });

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        setStatus("Offline (Firewall)");
      }
    }

    function setupMultiplayer() {
      if (!user || !db || !game.activeWorld) return;
      
      const content = document.getElementById('lobby-content');
      content.innerHTML = `
        <div class="text-xs text-indigo-300 mb-2 font-bold uppercase">${game.activeWorld} - <span id="lobby-count">1</span> Online</div>
        <div id="lobby-players" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar"></div>
      `;

      const lobbyRef = collection(db, 'artifacts', appId, 'public', 'data', `lobby_${game.activeWorld}`);
      
      if (unsubLobby) unsubLobby();

      unsubLobby = onSnapshot(lobbyRef, (snap) => {
        const active = [];
        const now = Date.now();
        snap.forEach(d => {
          if (now - d.data().lastActive < 30000) active.push({ id: d.id, ...d.data() });
        });
        
        const cntEl = document.getElementById('lobby-count');
        if (cntEl) cntEl.textContent = active.length;
        
        const playersDiv = document.getElementById('lobby-players');
        playersDiv.innerHTML = '';
        
        active.forEach(n => {
           const isMe = n.id === user.uid;
           playersDiv.innerHTML += `
             <div class="p-3 rounded-lg border ${isMe ? 'bg-indigo-900/40 border-indigo-500/50' : 'bg-slate-800 border-slate-700'}">
                <div class="font-bold text-sm text-slate-200">${isMe ? 'You' : 'Player'}</div>
                <div class="flex gap-3 text-xs text-slate-400 mt-1">
                  <span>🧑‍🌾 ${n.workers || 0}</span>
                  <span>🛡️ ${n.soldiers || 0}</span>
                  <span>💰 ${n.gold || 0}</span>
                </div>
              </div>
           `;
        });
      });

      // Multiplayer Ping
      setInterval(() => {
        if(!user || !db || !game.activeWorld) return;
        setDoc(doc(lobbyRef, user.uid), {
          gold: Math.floor(game.resources.gold),
          workers: game.workers.length,
          soldiers: game.soldiers.length,
          lastActive: Date.now()
        }, { merge: true }).catch(()=>{});
      }, 5000);
    }

    // --- BOOTSTRAP ---
    window.onload = () => {
      initMap();
      setupControls();
      initFirebase();
      setInterval(updateUI, 500); // Decouple UI text updates from 60fps loop
      requestAnimationFrame(gameLoop);
    };

  </script>
</body>
